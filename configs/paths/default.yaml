# path to root directory
# WORKSPACE_ROOT is used when it names a directory that exists, so that a run on
# a pod can keep its data and logs on shared cluster storage, and PROJECT_ROOT
# (set by rootutils) is the fallback everywhere that volume is absent
root_dir: ${env_dir:WORKSPACE_ROOT,PROJECT_ROOT}

# path to data directory
# inputs travel with the source tree, so this stays at the project root even
# when the outputs below go to shared cluster storage
data_dir: ${env_dir:PROJECT_ROOT}/data/

# path to logging directory
log_dir: ${paths.root_dir}/logs/

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}
